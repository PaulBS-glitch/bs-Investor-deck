<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm Your BuySooner Roadmap</title>
<style>
:root{--navy:#071f3a;--teal:#087a78;--pale:#eaf6f5;--border:#d7e5e4;--text:#1f2933;--muted:#64748b;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(8,122,120,.1),transparent 32%),linear-gradient(180deg,#fff 0%,#f7fbfb 48%,#eef8f7 100%)}.page{min-height:100vh;display:flex;justify-content:center;padding:32px 20px 44px}.shell{width:100%;max-width:1280px}.brand{margin-bottom:22px}.brand h1{margin:0;color:var(--navy);font-family:Georgia,'Times New Roman',serif;font-size:42px;letter-spacing:-.04em;line-height:.95}.brand-line{width:54px;height:4px;background:var(--teal);border-radius:999px;margin:12px 0 10px}.brand p{margin:0;color:var(--teal);font-size:15px;font-weight:800}.card{background:var(--white);border:1px solid var(--border);border-radius:28px;box-shadow:0 22px 70px rgba(7,31,58,.10);overflow:hidden}.confirm-panel{padding:44px;border-radius:26px;background:linear-gradient(180deg,#f3fbfa 0%,#fff 100%)}.confirm-panel h3{margin:0 0 8px;color:var(--navy);font-family:Georgia,'Times New Roman',serif;font-size:44px;letter-spacing:-.04em;line-height:1.05}.confirm-intro{margin:0 0 24px;color:var(--teal);font-weight:900;line-height:1.45;font-size:16px}.confirm-table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:18px;border:1px solid var(--border);background:#fff;margin-bottom:22px}.confirm-table th,.confirm-table td{text-align:left;vertical-align:top;padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.4}.confirm-table th{color:var(--navy);background:var(--pale);font-weight:900}.confirm-table tr:last-child td{border-bottom:none}.confirm-detail{color:var(--navy);font-weight:900;white-space:nowrap}.emotional-close{margin:10px auto 20px;padding:18px 8px 16px;max-width:940px;color:var(--navy);text-align:center;font-weight:900;line-height:1.45}.emotional-close span{display:block;margin-bottom:14px}.buttons{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:10px}button,a.button{appearance:none;border:none;border-radius:999px;padding:16px 26px;font-size:15px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--teal);color:#fff;box-shadow:0 10px 24px rgba(8,122,120,.22)}.primary:hover{background:#056261}.secondary{background:var(--pale);color:var(--navy)}.empty{padding:34px}.empty h2{margin:0 0 10px;color:var(--navy);font-size:34px}.empty p{margin:0 0 20px;color:var(--muted);font-weight:700}@media(max-width:760px){.confirm-panel{padding:26px}.confirm-panel h3{font-size:34px}.confirm-table{display:block;overflow:auto}.buttons{display:grid}.buttons>*{width:100%;text-align:center}}
</style>
</head>
<body>
<main class="page"><section class="shell"><div class="brand"><h1>BuySooner</h1><div class="brand-line"></div><p>Buy sooner. Buy smarter.</p></div><div class="card" id="app"></div></section></main>
<script>
const raw=localStorage.getItem('BuySoonerRoadmapInput');const app=document.getElementById('app');const num=v=>Number(String(v||'').replace(/[^0-9.-]/g,''))||0;const aud=v=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(Math.round(num(v)));const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(!raw){app.innerHTML='<section class="empty"><h2>No roadmap data found.</h2><p>Please complete the ownership check first.</p><a class="button primary" href="roadmap-data-form.html">Start Ownership Check</a></section>';}else{const d=JSON.parse(raw);const place=d.addressKnown==='yes'?d.address:d.targetArea;const start=d.customerType==='renting'?'Renting now':'Own and upgrading';const rentOrReason=d.customerType==='renting'?['The rent leak',aud(d.monthlyRent),'The amount you’ll be redirecting into your own home, not someone else’s.']:['Upgrade reason',esc(d.upgradeReason==='Other'?d.otherReason:d.upgradeReason),'The reason behind your next move, captured for your roadmap.'];const gap=Math.max(0,d.price*.2-d.deposit);const boost=gap;const total=d.deposit+boost;const bank=Math.max(0,d.price-total);function row(a,b,c){return '<tr><td>'+a+'</td><td class="confirm-detail">'+b+'</td><td>'+c+'</td></tr>'}app.innerHTML='<section class="confirm-panel"><h3>Let’s confirm your roadmap.</h3><p class="confirm-intro">This isn’t just a summary—it’s the foundation for '+esc(d.name)+'’ future home.</p><table class="confirm-table"><thead><tr><th>Milestone</th><th>Detail</th><th>Your Current Vision</th></tr></thead><tbody>'+row('The future owners',esc(d.name),'Your names on the title deed—personalised for your future.')+row('Starting point',start,d.customerType==='renting'?'Breaking the cycle. This is the last time you’ll fund a landlord’s retirement.':'Making your next move with a clearer pathway.')+row('Investment',aud(d.price),'We’re locking in this goal today, your home.')+row(d.addressKnown==='yes'?'Your home':'Your new neighbourhood',esc(place),'Where life happens. We’ve shaped this roadmap around your target location.')+row('Your deposit',aud(d.deposit),'Savings or deposit you can put towards buying your home.')+row(rentOrReason[0],rentOrReason[1],rentOrReason[2])+'</tbody></table><p class="emotional-close"><span>By bridging your '+aud(gap)+' deposit gap today</span><span>you aren\'t just buying a house—you’re securing your future before the market moves out of reach.</span><span>The bridge is the difference between watching from the sidelines and finally walking through your own front door.</span></p><div class="buttons"><button class="primary" id="startRoadmap">Start My Personalised Roadmap →</button><a class="button secondary" href="roadmap-data-form.html">Edit details</a></div></section>';document.getElementById('startRoadmap').onclick=function(){const formatted={targetPurchasePrice:aud(d.price),customerContribution:aud(d.deposit),buySoonerBoost:aud(boost),totalDeposit:aud(total),depositGap:aud(gap),estimatedBankLoan:aud(bank),currentRentMonthly:aud(d.monthlyRent),livingExpenses:aud(0),debts:aud(0),creditCardLimits:aud(0),income:aud(0),depositPercent:d.price?((total/d.price)*100).toFixed(1)+'%':'0.0%'};const out={capturedAt:new Date().toISOString(),source:'BuySooner standalone roadmap flow',rawInputs:d,customer:{name:d.name,buyerType:d.customerType==='upgrading'?'upgrader':'renter',dependants:0,income:0},property:{suburb:d.addressKnown==='yes'?d.address:d.targetArea,address:d.addressKnown==='yes'?d.address:'',targetPurchasePrice:d.price},finance:{customerContribution:d.deposit,currentRentMonthly:d.monthlyRent,livingExpenses:0,debts:0,creditCardLimits:0,buySoonerBoost:boost,estimatedBankLoan:bank},broker:{name:'Alex B Broker',firm:'AB Broker and Associates',email:'',phone:''},assumptions:{growthRate:0.05,refinanceStartYear:3,refinanceEndYear:5,refinanceTargetLvr:0.8},derived:{buySoonerBoost:boost,totalDeposit:total,depositGap:gap,depositPercent:d.price?total/d.price:0,estimatedBankLoan:bank,formatted:formatted}};localStorage.setItem('BuySoonerRoadmapData',JSON.stringify(out));location.href='roadmap.html?v=personalised-plan';};}
</script>
</body>
</html>
