<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm Your BuySooner Roadmap</title>
<style>
:root{--navy:#071f3a;--teal:#087a78;--pale:#eaf6f5;--border:#d7e5e4;--text:#1f2933;--muted:#64748b;--white:#fff}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at top left,rgba(8,122,120,.1),transparent 32%),linear-gradient(180deg,#fff 0%,#f7fbfb 48%,#eef8f7 100%)}.page{min-height:100vh;display:flex;justify-content:center;padding:32px 20px 44px}.shell{width:100%;max-width:1180px;min-width:0}.brand{margin-bottom:22px}.brand h1{margin:0;color:var(--navy);font-family:Georgia,'Times New Roman',serif;font-size:42px;letter-spacing:-.04em;line-height:.95}.brand-line{width:54px;height:4px;background:var(--teal);border-radius:999px;margin:12px 0 10px}.brand p{margin:0;color:var(--teal);font-size:15px;font-weight:800}.card{background:var(--white);border:1px solid var(--border);border-radius:28px;box-shadow:0 22px 70px rgba(7,31,58,.10);overflow:hidden;min-width:0}.confirm-panel{padding:44px;border-radius:26px;background:linear-gradient(180deg,#f3fbfa 0%,#fff 100%);min-width:0}.confirm-panel h3{margin:0 0 8px;color:var(--navy);font-family:Georgia,'Times New Roman',serif;font-size:44px;letter-spacing:-.04em;line-height:1.05}.confirm-intro{margin:0 0 24px;color:var(--teal);font-weight:900;line-height:1.45;font-size:16px}.table-wrap{width:100%;overflow:hidden;border-radius:18px;border:1px solid var(--border);background:#fff;margin-bottom:22px}.confirm-table{width:100%;table-layout:fixed;border-collapse:collapse;background:#fff}.confirm-table th,.confirm-table td{text-align:left;vertical-align:top;padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.4;overflow-wrap:anywhere;word-break:normal}.confirm-table th{color:var(--navy);background:var(--pale);font-weight:900}.confirm-table tr:last-child td{border-bottom:none}.confirm-table th:nth-child(1),.confirm-table td:nth-child(1){width:21%}.confirm-table th:nth-child(2),.confirm-table td:nth-child(2){width:31%}.confirm-table th:nth-child(3),.confirm-table td:nth-child(3){width:48%}.confirm-detail{color:var(--navy);font-weight:900;white-space:normal}.emotional-close{margin:10px auto 20px;padding:18px 8px 16px;max-width:940px;color:var(--navy);text-align:center;font-weight:900;line-height:1.45}.emotional-close span{display:block;margin-bottom:14px}.buttons{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:10px}button,a.button{appearance:none;border:none;border-radius:999px;padding:16px 26px;font-size:15px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:var(--teal);color:#fff;box-shadow:0 10px 24px rgba(8,122,120,.22)}.primary:hover{background:#056261}.secondary{background:var(--pale);color:var(--navy)}.empty{padding:34px}.empty h2{margin:0 0 10px;color:var(--navy);font-size:34px}.empty p{margin:0 0 20px;color:var(--muted);font-weight:700}@media(max-width:760px){.page{padding:22px 14px 34px}.confirm-panel{padding:24px}.confirm-panel h3{font-size:34px}.confirm-intro{font-size:15px}.table-wrap{overflow:visible}.confirm-table,.confirm-table thead,.confirm-table tbody,.confirm-table tr,.confirm-table th,.confirm-table td{display:block;width:100%!important}.confirm-table thead{display:none}.confirm-table tr{border-bottom:1px solid var(--border);padding:12px 0}.confirm-table tr:last-child{border-bottom:none}.confirm-table td{border-bottom:none;padding:6px 0}.confirm-table td:first-child{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:900}.buttons{display:grid}.buttons>*{width:100%;text-align:center}}
</style>
</head>
<body>
<main class="page"><section class="shell"><div class="brand"><h1>BuySooner</h1><div class="brand-line"></div><p>Buy sooner. Buy smarter.</p></div><div class="card" id="app"></div></section></main>
<script>
const raw=localStorage.getItem('BuySoonerRoadmapInput');
const app=document.getElementById('app');
const num=v=>Number(String(v||'').replace(/[^0-9.-]/g,''))||0;
const aud=v=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(Math.round(num(v)));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function buildRoadmapData(d){
  const price=num(d.price), deposit=num(d.deposit), rent=num(d.monthlyRent);
  const gap=Math.max(0,price*0.2-deposit), boost=gap, total=deposit+boost, bank=Math.max(0,price-total);
  const formatted={targetPurchasePrice:aud(price),customerContribution:aud(deposit),buySoonerBoost:aud(boost),totalDeposit:aud(total),depositGap:aud(gap),estimatedBankLoan:aud(bank),currentRentMonthly:aud(rent),livingExpenses:aud(0),debts:aud(0),creditCardLimits:aud(0),income:aud(0),depositPercent:price?((total/price)*100).toFixed(1)+'%':'0.0%'};
  return {capturedAt:new Date().toISOString(),source:'BuySooner standalone roadmap flow',rawInputs:d,customer:{name:d.name,buyerType:d.customerType==='upgrading'?'upgrader':'renter',dependants:0,income:0},property:{suburb:d.addressKnown==='yes'?d.address:d.targetArea,address:d.addressKnown==='yes'?d.address:'',targetPurchasePrice:price},finance:{customerContribution:deposit,currentRentMonthly:rent,livingExpenses:0,debts:0,creditCardLimits:0,buySoonerBoost:boost,estimatedBankLoan:bank},broker:{name:'Alex B Broker',firm:'AB Broker and Associates',email:'',phone:''},assumptions:{growthRate:0.05,refinanceStartYear:3,refinanceEndYear:5,refinanceTargetLvr:0.8},derived:{buySoonerBoost:boost,totalDeposit:total,depositGap:gap,depositPercent:price?total/price:0,estimatedBankLoan:bank,formatted:formatted}};
}
function row(a,b,c){return '<tr><td>'+a+'</td><td class="confirm-detail">'+b+'</td><td>'+c+'</td></tr>'}
try{
  if(!raw){
    app.innerHTML='<section class="empty"><h2>No roadmap data found.</h2><p>Please complete the ownership check first.</p><a class="button primary" href="roadmap-data-form.html">Start Ownership Check</a></section>';
  }else{
    const d=JSON.parse(raw);
    const out=buildRoadmapData(d);
    localStorage.setItem('BuySoonerRoadmapData',JSON.stringify(out));
    window.BuySoonerRoadmapData=out;
    const place=d.addressKnown==='yes'?d.address:d.targetArea;
    const start=d.customerType==='renting'?'Renting now':'Own and upgrading';
    const rr=d.customerType==='renting'?['The rent leak',aud(d.monthlyRent),'The amount you will be redirecting into your own home, not someone else’s.']:['Upgrade reason',esc(d.upgradeReason==='Other'?d.otherReason:d.upgradeReason),'The reason behind your next move, captured for your roadmap.'];
    const gap=out.derived.depositGap;
    app.innerHTML='<section class="confirm-panel"><h3>Let’s confirm your roadmap.</h3><p class="confirm-intro">This isn’t just a summary — it is the foundation for '+esc(d.name)+'’ future home.</p><div class="table-wrap"><table class="confirm-table"><thead><tr><th>Milestone</th><th>Detail</th><th>Your Current Vision</th></tr></thead><tbody>'+row('The future owners',esc(d.name),'Your names on the title deed — personalised for your future.')+row('Starting point',start,d.customerType==='renting'?'Breaking the cycle. This is the last time you fund a landlord’s retirement.':'Making your next move with a clearer pathway.')+row('Investment',aud(d.price),'We are locking in this goal today: your home.')+row(d.addressKnown==='yes'?'Your home':'Your new neighbourhood',esc(place),'Where life happens. This roadmap is shaped around your target location.')+row('Your deposit',aud(d.deposit),'Savings or deposit you can put towards buying your home.')+row(rr[0],rr[1],rr[2])+'</tbody></table></div><p class="emotional-close"><span>By bridging your '+aud(gap)+' deposit gap today</span><span>you are not just buying a house — you are securing your future before the market moves further out of reach.</span><span>The bridge is the difference between watching from the sidelines and finally walking through your own front door.</span></p><div class="buttons"><a class="button primary" href="roadmap.html?v=personalised-plan">Start My Personalised Roadmap</a><a class="button secondary" href="roadmap-data-form.html">Edit details</a></div></section>';
  }
}catch(e){
  console.error(e);
  app.innerHTML='<section class="empty"><h2>Roadmap data could not be loaded.</h2><p>Please return to the ownership check and resubmit your details.</p><a class="button primary" href="roadmap-data-form.html">Restart Ownership Check</a></section>';
}
</script>
<script src="appendix-back-button.js?v=appendix-return"></script>
</body>
</html>
