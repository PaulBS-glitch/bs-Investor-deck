<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuySooner Roadmap</title>
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7fbfb;color:#1f2933;padding:clamp(14px,2.4vw,28px)}#roadmap-root{width:min(1120px,calc(100vw - 28px));max-width:1120px;margin:0 auto;min-width:0}#roadmap-root *{box-sizing:border-box}#roadmap-root img,#roadmap-root svg,#roadmap-root canvas,#roadmap-root video{max-width:100%;height:auto}#roadmap-root table{width:100%;table-layout:fixed;border-collapse:collapse}#roadmap-root th,#roadmap-root td{overflow-wrap:anywhere;word-break:normal}#roadmap-root button,#roadmap-root a{max-width:100%}.empty{background:#fff;border:1px solid #d7e5e4;border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(7,31,58,.08)}.empty h1{margin:0 0 10px;color:#071f3a;font-size:clamp(28px,5vw,34px);line-height:1.05}.empty p{margin:0;color:#64748b;font-size:16px;line-height:1.5;font-weight:700}@media(max-width:760px){body{padding:12px}#roadmap-root{width:100%;max-width:none}.empty{padding:24px;border-radius:20px}#roadmap-root [class*="grid"],#roadmap-root [class*="cols"],#roadmap-root [class*="columns"]{grid-template-columns:1fr!important}#roadmap-root [class*="actions"],#roadmap-root [class*="buttons"],#roadmap-root .nav{display:grid!important;grid-template-columns:1fr!important;gap:12px!important}#roadmap-root [class*="actions"] > *,#roadmap-root [class*="buttons"] > *,#roadmap-root .nav > *{width:100%!important;text-align:center!important}}
</style>
</head>
<body>
<main id="roadmap-root"><section class="empty"><h1>Loading your roadmap</h1><p>Preparing your personalised BuySooner plan.</p></section></main>
<script>
(function(){
var critical=['roadmap-data.js','roadmap-cover.js','roadmap-page1.js','roadmap-page2.js'];
var loaded={};
function loadScript(src,cb){
 if(loaded[src]){if(cb)cb();return;}
 var s=document.createElement('script');
 s.src=src+'?v=roadmap-page2-nav';
 s.onload=function(){loaded[src]=true;if(cb)cb();};
 s.onerror=function(){loaded[src]=true;if(cb)cb();};
 document.body.appendChild(s);
}
function loadSeries(list,done){var i=0;function next(){if(i>=list.length){if(done)done();return;}loadScript(list[i++],next);}next();}
function n(v){return Number(String(v||'').replace(/[^0-9.-]/g,''))||0;}
function money(v){return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(Math.round(n(v)));}
function buildFromInput(){
 try{
  var raw=localStorage.getItem('BuySoonerRoadmapInput');
  if(!raw)return null;
  var d=JSON.parse(raw);
  var price=n(d.price), deposit=n(d.deposit), rent=n(d.monthlyRent);
  if(!price&&!deposit&&!d.name)return null;
  var gap=Math.max(0,price*0.2-deposit), boost=gap, total=deposit+boost, bank=Math.max(0,price-total);
  var formatted={targetPurchasePrice:money(price),customerContribution:money(deposit),buySoonerBoost:money(boost),totalDeposit:money(total),depositGap:money(gap),estimatedBankLoan:money(bank),currentRentMonthly:money(rent),livingExpenses:money(0),debts:money(0),creditCardLimits:money(0),income:money(0),depositPercent:price?((total/price)*100).toFixed(1)+'%':'0.0%'};
  var out={capturedAt:new Date().toISOString(),source:'BuySooner roadmap fallback from calculator input',rawInputs:d,customer:{name:d.name||'Customer',buyerType:d.customerType==='upgrading'?'upgrader':'renter',dependants:0,income:0},property:{suburb:d.addressKnown==='yes'?d.address:d.targetArea,address:d.addressKnown==='yes'?d.address:'',targetPurchasePrice:price},finance:{customerContribution:deposit,currentRentMonthly:rent,livingExpenses:0,debts:0,creditCardLimits:0,buySoonerBoost:boost,estimatedBankLoan:bank},broker:{name:'Alex B Broker',firm:'AB Broker and Associates',email:'',phone:''},assumptions:{growthRate:0.05,refinanceStartYear:3,refinanceEndYear:5,refinanceTargetLvr:0.8},derived:{buySoonerBoost:boost,totalDeposit:total,depositGap:gap,depositPercent:price?total/price:0,estimatedBankLoan:bank,formatted:formatted}};
  localStorage.setItem('BuySoonerRoadmapData',JSON.stringify(out));
  window.BuySoonerRoadmapData=out;
  return out;
 }catch(e){return null;}
}
function render(){
 var root=document.getElementById('roadmap-root');
 var data=window.BSRoadmap&&window.BSRoadmap.load?window.BSRoadmap.load():null;
 if(!data)data=buildFromInput();
 if(data&&window.renderRoadmapCover){window.renderRoadmapCover(data,root);return;}
 if(data&&window.renderRoadmapPage1){window.renderRoadmapPage1(data,root);return;}
 root.innerHTML='<section class="empty"><h1>No roadmap data found</h1><p>Complete the prototype first, then open this roadmap.</p></section>';
}
loadSeries(critical,render);
})();
</script>
</body>
</html>
